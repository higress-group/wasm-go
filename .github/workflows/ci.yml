name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.24-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.24-

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Install Binaryen 130
        env:
          BINARYEN_VERSION: "130"
          BINARYEN_SHA256: "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc"
        run: |
          archive="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          echo "${BINARYEN_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/binaryen-version_${BINARYEN_VERSION}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" --version

      - name: Run tests in pkg directory
        run: |
          echo "Running tests in pkg directory..."
          if [ -f "go.mod" ]; then
            echo "Testing root pkg modules..."
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./pkg/...
          fi

      - name: Run tests in examples directory
        run: |
          echo "Running tests in examples directory..."
          cd examples
          for dir in */; do
            if [ -f "${dir}go.mod" ]; then
              echo "Testing example: ${dir}..."
              cd "$dir"
              go test -v -coverprofile=coverage.out -covermode=atomic ./...
              cd ..
            fi
          done

      - name: Build lightweight wrapper profile
        run: |
          cd examples/request-block
          if GOOS=wasip1 GOARCH=wasm go list -tags=wasm_lite_http -deps . | grep -qx net/http; then
            echo "lightweight wrapper profile unexpectedly depends on net/http" >&2
            exit 1
          fi
          GO_BUILD_TAGS=wasm_lite_http make build

      - name: Check code formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: |
          go vet ./...
          cd examples
          for dir in */; do
            if [ -f "${dir}go.mod" ]; then
              cd "$dir"
              go vet ./...
              cd ..
            fi
          done

